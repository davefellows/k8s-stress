apiVersion: v1
kind: Pod
metadata:
  name: postgres-workload
  namespace: stress-test
spec:
  nodeSelector:
    kubernetes.io/hostname: aks-f16-23743720-vmss000000
  containers:
  - name: postgres
    image: postgres:15
    env:
    - name: POSTGRES_PASSWORD
      value: "testpassword"
    - name: POSTGRES_DB
      value: "testdb"
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
    volumeMounts:
    - name: pgdata
      mountPath: /var/lib/postgresql/data
  - name: pgbench
    image: postgres:15
    command: ["/bin/bash", "-c"]
    args:
    - |
      # Wait for postgres to be ready
      sleep 30
      # Initialize pgbench database
      PGPASSWORD=testpassword pgbench -i -s 50 -h localhost -U postgres testdb
      # Run continuous pgbench test with typical OLTP workload
      while true; do
        PGPASSWORD=testpassword pgbench -c 20 -j 4 -T 300 -h localhost -U postgres testdb
        sleep 5
      done
    env:
    - name: PGPASSWORD
      value: "testpassword"
  volumes:
  - name: pgdata
    emptyDir: {} 