apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-stress
  labels:
    app: node-stress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-stress
  template:
    metadata:
      labels:
        app: node-stress
    spec:
      containers:
      - name: cpu-stress
        image: polinux/stress-ng
        command: ["stress-ng"]
        args:
          - "--cpu"
          - "8"
          - "--cpu-load"
          - "100"
          - "--timeout"
          - "0"
      
      - name: memory-stress
        image: polinux/stress-ng
        command: ["stress-ng"]
        args:
          - "--vm"
          - "4"
          - "--vm-bytes"
          - "8G"
          - "--vm-keep"
          - "--timeout"
          - "0"
      
      - name: io-stress
        image: ubuntu:latest
        command: ["/bin/bash"]
        args:
          - "-c"
          - |
            apt-get update && apt-get install -y fio
            while true; do
              fio --name=randwrite --ioengine=libaio --direct=1 --bs=4k --size=4G \
                --numjobs=8 --rw=randwrite --iodepth=64 --runtime=60 --time_based \
                --group_reporting --directory=/mnt/stress
              fio --name=randread --ioengine=libaio --direct=1 --bs=4k --size=4G \
                --numjobs=8 --rw=randread --iodepth=64 --runtime=60 --time_based \
                --group_reporting --directory=/mnt/stress
            done
        volumeMounts:
        - name: test-vol
          mountPath: /mnt/stress
      
      - name: file-stress
        image: ubuntu:latest
        command: ["/bin/bash"]
        args:
          - "-c"
          - |
            mkdir -p /mnt/stress/dir{1..8}
            while true; do
              for d in {1..8}; do
                for i in {1..25000}; do
                  dd if=/dev/urandom of=/mnt/stress/dir$d/file$i bs=4k count=1 2>/dev/null &
                  if [ $((i % 100)) -eq 0 ]; then
                    wait
                  fi
                done
                wait
                rm -rf /mnt/stress/dir$d/*
              done
            done
        volumeMounts:
        - name: test-vol
          mountPath: /mnt/stress
      
      volumes:
      - name: test-vol
        emptyDir: {}
