apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  namespace: stress-test
spec:
  nodeSelector:
    kubernetes.io/hostname: aks-f16-23743720-vmss000000
  containers:
  - name: cpu-stress
    image: ubuntu
    command: ["/bin/bash", "-c"]
    args: 
      - |
        # CPU stress using pure bash arithmetic
        for i in $(seq 1 $(nproc)); do
          while true; do
            # Pure bash calculation loop to consume CPU
            for j in {1..10000}; do
              ((j*j)) > /dev/null 2>&1
            done
          done & 
        done
        wait
