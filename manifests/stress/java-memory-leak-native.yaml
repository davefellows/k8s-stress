apiVersion: v1
kind: Pod
metadata:
  name: java-memory-leak-native
  namespace: stress-test
spec:
  nodeSelector:
    kubernetes.io/hostname: aks-f16-23743720-vmss000000
  initContainers:
  - name: init
    image: openjdk:11-jdk
    command: ["/bin/sh"]
    args:
      - "-c"
      - |
        # First install JNA
        mkdir -p /app/lib
        wget -O /app/lib/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.13.0/jna-5.13.0.jar
        
        cat << 'EOF' > /app/Main.java
        import java.util.*;
        import com.sun.jna.*;
        import com.sun.jna.ptr.*;

        public class Main {
            // Native memory interface
            private static class CLibrary {
                static {
                    Native.register("c");
                }
                
                public static native Pointer malloc(long size);
                public static native void free(Pointer p);
                public static native int memset(Pointer p, int value, long size);
            }
            
            private static final List<Pointer> leakyList = new ArrayList<>();
            private static long totalAllocated = 0;
            
            public static void main(String[] args) {
                System.out.println("Starting Java application with native memory allocation...");
                System.out.println("Using JNA to allocate memory directly from the OS");
                
                // Start monitoring thread
                new Thread(() -> {
                    while(true) {
                        Runtime rt = Runtime.getRuntime();
                        long total = rt.totalMemory();
                        long free = rt.freeMemory();
                        long used = total - free;
                        long max = rt.maxMemory();
                        
                        System.out.printf("[%d chunks, %.2f GB allocated] JVM Memory - Total: %dMB, Used: %dMB, Free: %dMB, Max: %dMB%n",
                            leakyList.size(), totalAllocated/1024.0/1024.0/1024.0,
                            total/1024/1024, used/1024/1024, free/1024/1024, max/1024/1024);
                        
                        try {
                            Thread.sleep(1000);
                        } catch (InterruptedException e) {}
                    }
                }).start();
                
                // Main allocation loop - allocate native memory gradually
                int chunkSize = 256 * 1024 * 1024; // 256MB chunks
                
                while(true) {
                    try {
                        // Allocate native memory
                        Pointer chunk = CLibrary.malloc(chunkSize);
                        if (chunk == null) {
                            throw new OutOfMemoryError("Native malloc failed");
                        }
                        
                        // Write to the memory to ensure physical allocation
                        CLibrary.memset(chunk, 1, chunkSize);
                        
                        synchronized(leakyList) {
                            leakyList.add(chunk);
                            totalAllocated += chunkSize;
                        }
                        
                        // Sleep between allocations
                        Thread.sleep(500);
                    } catch (Throwable e) {
                        System.out.println("Allocation error: " + e);
                        try {
                            Thread.sleep(1000);
                        } catch (InterruptedException ie) {}
                    }
                }
            }
        }
        EOF
        javac -cp /app/lib/jna.jar /app/Main.java
    volumeMounts:
    - name: app-volume
      mountPath: /app
  containers:
  - name: java-app
    image: openjdk:11-jdk
    command: ["java"]
    args:
      - "-XX:+UnlockExperimentalVMOptions"
      - "-XX:-UseContainerSupport"
      - "-Xms1g"                     # Small heap since we're using native memory
      - "-Xmx2g"                     # Small heap since we're using native memory
      - "-cp"
      - "/app/lib/jna.jar:/app"
      - "Main"
    securityContext:
      privileged: true               # Run with privileged access
    resources:
      requests:
        memory: "16Gi"              # Request large memory
        cpu: "1000m"
      limits:
        memory: "64Gi"              # Set very high limit
        cpu: "2000m"
    volumeMounts:
    - name: app-volume
      mountPath: /app
  volumes:
  - name: app-volume
    emptyDir: {} 