apiVersion: v1
kind: Pod
metadata:
  name: java-memory-leak-nodejvm
  namespace: stress-test
spec:
  nodeSelector:
    kubernetes.io/hostname: aks-f16-23743720-vmss000000
  initContainers:
  - name: init
    image: openjdk:11-jdk
    command: ["/bin/sh"]
    args:
      - "-c"
      - |
        cat << 'EOF' > /app/Main.java
        import java.util.*;
        import java.lang.management.*;

        public class Main {
            private static final List<byte[]> leakyList = new ArrayList<>();
            private static long totalAllocated = 0;
            
            public static void main(String[] args) {
                System.out.println("Starting Java application to trigger Linux OOM killer...");
                System.out.println("JVM is running in system mode with gradual allocation");
                
                // Start monitoring thread
                new Thread(() -> {
                    while(true) {
                        Runtime rt = Runtime.getRuntime();
                        long total = rt.totalMemory();
                        long free = rt.freeMemory();
                        long used = total - free;
                        long max = rt.maxMemory();
                        
                        System.out.printf("[%d chunks, %.2f GB allocated] JVM Memory - Total: %dMB, Used: %dMB, Free: %dMB, Max: %dMB%n",
                            leakyList.size(), totalAllocated/1024.0/1024.0/1024.0,
                            total/1024/1024, used/1024/1024, free/1024/1024, max/1024/1024);
                        
                        try {
                            Thread.sleep(1000);
                        } catch (InterruptedException e) {}
                    }
                }).start();
                
                // Main allocation loop - allocate gradually
                Random rand = new Random();
                int chunkSize = 256 * 1024 * 1024; // 256MB chunks
                
                while(true) {
                    try {
                        // Create chunks in parallel but with fewer threads
                        Thread[] allocators = new Thread[2]; // Reduced from 4 to 2 threads
                        for (int i = 0; i < allocators.length; i++) {
                            allocators[i] = new Thread(() -> {
                                try {
                                    byte[] chunk = new byte[chunkSize];
                                    // Write data to force physical allocation
                                    for(int j = 0; j < chunkSize; j += 4096) {
                                        chunk[j] = 1;
                                    }
                                    synchronized(leakyList) {
                                        leakyList.add(chunk);
                                        totalAllocated += chunkSize;
                                    }
                                } catch (Throwable e) {
                                    System.out.println("Allocation thread error: " + e);
                                }
                            });
                            allocators[i].start();
                        }
                        
                        // Wait for all allocations to complete or fail
                        for (Thread t : allocators) {
                            t.join(1000); // Longer timeout
                        }
                        
                        // Sleep between allocation rounds
                        Thread.sleep(500);
                    } catch (Throwable e) {
                        System.out.println("Main thread error: " + e);
                        try {
                            Thread.sleep(1000);
                        } catch (InterruptedException ie) {}
                    }
                }
            }
        }
        EOF
        javac /app/Main.java
    volumeMounts:
    - name: app-volume
      mountPath: /app
  containers:
  - name: java-app
    image: openjdk:11-jdk
    command: ["java"]
    args:
      - "-XX:+UnlockExperimentalVMOptions"
      - "-XX:-UseContainerSupport"
      - "-XX:+AlwaysPreTouch"
      - "-Xms8g"                     # Start with larger heap
      - "-Xmx32g"                    # Set higher than node memory
      - "-XX:+DisableExplicitGC"     # Prevent GC from interfering
      - "-XX:-UseCompressedOops"     # Use full 64-bit object pointers
      - "-XX:+G1GC"                  # Use G1 collector
      - "-XX:MaxGCPauseMillis=10"    # Minimize GC pauses
      - "-XX:G1HeapRegionSize=32m"   # Larger regions
      - "-XX:-UseGCOverheadLimit"    # Disable GC overhead limit
      - "-XX:+HeapDumpOnOutOfMemoryError"
      - "-XX:HeapDumpPath=/tmp/heapdump.hprof"
      - "-cp"
      - "/app"
      - "Main"
    securityContext:
      privileged: true               # Run with privileged access
    resources:
      requests:
        memory: "16Gi"              # Request large memory
        cpu: "2000m"
      limits:
        memory: "64Gi"              # Set very high limit
        cpu: "4000m"
    volumeMounts:
    - name: app-volume
      mountPath: /app
  volumes:
  - name: app-volume
    emptyDir: {} 